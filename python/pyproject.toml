[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xmlsec-verify"
version = "0.1.0"
description = "Python verifier for detached XML Digital Signatures produced by the xmlsec PoC."
requires-python = ">=3.10"
dependencies = [
    "signxml>=3.2",
    "cryptography>=41",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["xmlsec_verify*"]
